<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVEWORLD — Minecraft Server</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--line:rgba(255,255,255,.10);--pink:#ff2d95;--cyan:#00e5ff;--orange:#ff8c42;--yellow:#ffd166;--green:#6ab04c;--green-2:#8bc34a;--red:#ff4757;--text:#f5ecff;--muted:#a894b8;--solid:#150a22}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',system-ui,sans-serif;color:var(--text);min-height:100vh;background:radial-gradient(circle at 85% 8%,rgba(255,45,149,.18),transparent 42%),radial-gradient(circle at 12% 92%,rgba(0,229,255,.12),transparent 45%),linear-gradient(180deg,#07040d 0%,#100820 55%,#15092a 100%);background-attachment:fixed}
.wrap{max-width:1240px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:linear-gradient(180deg,rgba(30,18,45,.85),rgba(15,8,24,.85));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45);position:sticky;top:12px;z-index:20}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-mark{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--orange) 55%,var(--cyan));box-shadow:0 0 30px rgba(255,45,149,.45)}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;line-height:1;background:linear-gradient(90deg,#fff,var(--yellow) 40%,var(--pink) 75%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-text small{display:block;font-family:Montserrat;font-size:9px;letter-spacing:3px;font-weight:800;color:var(--green-2);margin-top:4px;-webkit-text-fill-color:var(--green-2)}
nav{display:flex;gap:4px;flex-wrap:wrap}
.nav-btn{background:transparent;color:var(--muted);border:1px solid transparent;font:inherit;font-size:13px;font-weight:700;padding:10px 14px;border-radius:10px;cursor:pointer;transition:.22s}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.06);border-color:var(--line)}
.nav-btn.active{color:#fff;background:linear-gradient(135deg,var(--pink),var(--orange));border-color:transparent;box-shadow:0 6px 20px rgba(255,45,149,.35)}
.page{display:none}.page.active{display:block}
.hero{margin:20px 0 24px;padding:44px 36px;border-radius:20px;background:linear-gradient(120deg,rgba(255,45,149,.18),rgba(123,44,191,.15) 45%,rgba(0,229,255,.10));border:1px solid rgba(255,255,255,.14)}
.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.35);margin-bottom:16px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,7vw,84px);line-height:.95;letter-spacing:3px;color:#fff;text-transform:uppercase;margin-bottom:16px}
.hero h1 span{background:linear-gradient(90deg,var(--yellow),var(--pink) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:640px;color:var(--muted);font-size:15px;line-height:1.7}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:#fff;text-transform:uppercase;margin:28px 0 14px;display:flex;align-items:center;gap:12px}
.sec-title::before{content:"";width:5px;height:26px;border-radius:2px;background:linear-gradient(180deg,var(--pink),var(--orange))}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:20px 0}
.feature{padding:22px;border-radius:16px;background:linear-gradient(135deg,rgba(30,18,45,.75),rgba(15,8,24,.85));border:1px solid var(--line)}
.feature .fi{font-size:32px;margin-bottom:10px;display:inline-block}
.feature h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:6px;color:#fff}
.feature p{color:var(--muted);font-size:13px;line-height:1.6}
.cat-tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.cat-tab{padding:9px 16px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.cat-tab.active{color:#0a0a0a;background:linear-gradient(135deg,var(--pink),var(--orange));border-color:transparent}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:16px 0 24px}
.product{overflow:hidden;border-radius:16px;display:flex;flex-direction:column;background:linear-gradient(135deg,rgba(30,18,45,.75),rgba(15,8,24,.85));border:1px solid var(--line)}
.product-img{height:92px;display:grid;place-items:center;font-size:40px;color:#fff;position:relative}
.product-tier{position:absolute;top:10px;left:12px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.5);color:#fff}
.product-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.product-body h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#fff}
.product-features{list-style:none;padding:0;margin:4px 0;display:flex;flex-direction:column;gap:5px;flex:1}
.product-features li{font-size:11.5px;color:#d8cbe8;padding-left:16px;position:relative;line-height:1.45}
.product-features li::before{content:"▸";position:absolute;left:0;color:var(--pink);font-weight:800}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--yellow);margin-top:8px}
.buy-btn{padding:11px;border:0;cursor:pointer;border-radius:8px;font:inherit;font-size:12px;font-weight:800;color:#0a0a0a;background:linear-gradient(135deg,var(--green-2),var(--green))}
.panel{padding:26px;border-radius:16px;background:linear-gradient(135deg,rgba(30,18,45,.75),rgba(15,8,24,.85));border:1px solid var(--line);margin:20px 0}
.panel h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#fff;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel h2::before{content:"";width:5px;height:22px;border-radius:2px;background:linear-gradient(180deg,var(--pink),var(--orange))}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0}
.contact-card{padding:20px;border-radius:14px;display:flex;align-items:center;gap:16px;cursor:pointer;background:linear-gradient(135deg,rgba(30,18,45,.75),rgba(15,8,24,.85));border:1px solid var(--line)}
.contact-icon{width:54px;height:54px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:26px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3)}
.contact-body .label{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.contact-body .value{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;word-break:break-all}
.form{display:flex;flex-direction:column;gap:14px;max-width:560px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;font:inherit;font-size:14px;outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pink)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}
.field select option{background:var(--solid);color:#fff}
.field .hint{font-size:11px;color:var(--muted);margin-top:2px}
.btn{padding:13px 20px;border:0;cursor:pointer;border-radius:10px;font:inherit;font-size:13px;font-weight:800;color:#0a0a0a;background:linear-gradient(135deg,var(--pink),var(--orange))}
.btn-ghost{background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--line)}
.btn-green{background:linear-gradient(135deg,var(--green-2),var(--green));color:#0a0a0a}
.btn-red{background:linear-gradient(135deg,var(--red),#b81020);color:#fff}
.btn-yellow{background:linear-gradient(135deg,#ffd166,#f5a623);color:#0a0a0a;box-shadow:0 0 24px rgba(255,209,102,.35)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.profile-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.avatar{width:96px;height:96px;border-radius:20px;display:grid;place-items:center;font-family:'Bebas Neue',sans-serif;font-size:44px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--orange),var(--cyan))}
.profile-info h2{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#fff}
.profile-info p{color:var(--muted);font-size:13px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.info-item{padding:14px 16px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.info-item .lbl{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.info-item .val{font-size:14px;font-weight:700;color:#fff;word-break:break-all}
.balance-card{padding:24px;border-radius:16px;margin:16px 0;background:linear-gradient(135deg,rgba(255,209,102,.14),rgba(255,140,66,.10) 50%,rgba(255,45,149,.08));border:1px solid rgba(255,209,102,.3);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.balance-info .lbl{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
.balance-info .amount{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;letter-spacing:2px;background:linear-gradient(90deg,var(--yellow),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.progress-bar{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.progress-fill{height:100%;transition:width .5s ease;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;font-weight:700}
.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.reward{padding:16px;border-radius:12px;text-align:center;background:rgba(0,0,0,.3);border:1px solid var(--line);opacity:.45}
.reward.unlocked{opacity:1;border-color:var(--green);background:linear-gradient(135deg,rgba(106,176,76,.15),rgba(139,195,74,.08))}
.reward-icon{font-size:28px;margin-bottom:6px}
.reward-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff}
.reward-time{font-size:11px;color:var(--muted);margin-top:2px;font-weight:700}
.reward-status{font-size:10px;font-weight:800;margin-top:6px;color:var(--green-2)}
.reward.locked .reward-status{color:var(--muted)}
.admin-login{max-width:420px;margin:20px auto}
.admin-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
.action-btn{padding:16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(30,18,45,.75),rgba(15,8,24,.85));color:#fff;font:inherit;font-size:13px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.action-btn .ai{font-size:24px}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.stat{padding:18px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.stat .lbl{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat .val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--pink)}
.list{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:360px;overflow-y:auto}
.list-item{padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.list-item .body strong{font-size:13px;color:#fff}
.list-item .body span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.list-item .meta{font-size:10px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px;font-style:italic}
.toast{position:fixed;right:24px;bottom:24px;z-index:100;padding:14px 20px;border-radius:10px;background:rgba(15,8,24,.96);border:1px solid var(--green);color:#fff;font-size:13px;font-weight:700;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s;max-width:320px}
.toast.show{opacity:1;transform:none}.toast.error{border-color:var(--red)}
.modal-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{width:100%;max-width:460px;padding:28px;border-radius:18px;background:linear-gradient(135deg,#1e1230,#100820);border:1px solid rgba(255,209,102,.3);position:relative}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:#fff;margin-bottom:6px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.modal .close-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:18px;cursor:pointer}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.preset{padding:14px 8px;border-radius:12px;cursor:pointer;text-align:center;background:rgba(0,0,0,.4);border:1px solid var(--line);color:#fff;font:inherit;font-weight:800;font-size:15px}
.preset small{display:block;font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0 10px;border-top:1px solid var(--line);margin-top:30px}
footer span{color:var(--pink)}
#fatal{display:none;margin:20px;padding:20px;border-radius:12px;background:rgba(255,71,87,.15);border:1px solid var(--red);color:#fff;font-family:monospace;font-size:13px;white-space:pre-wrap}
@media(max-width:780px){.wrap{padding:14px}header{padding:12px 14px;position:static}.hero{padding:26px 22px}.balance-info .amount{font-size:34px}.presets{grid-template-columns:repeat(2,1fr)}}
</style>
