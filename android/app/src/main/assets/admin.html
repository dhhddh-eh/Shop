<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ-панель — ShopLiveworlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin">
  <div class="bg-glow"></div>

  <header class="topbar">
    <a href="index.html" class="brand">
      <svg class="logo" viewBox="0 0 60 60" aria-hidden="true">
        <defs><linearGradient id="lg-adm" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff2d95"/><stop offset="100%" stop-color="#7b2ff7"/>
        </linearGradient></defs>
        <circle cx="30" cy="30" r="27" fill="#0b0616" stroke="url(#lg-adm)" stroke-width="3"/>
        <text x="30" y="41" text-anchor="middle" font-family="Anton" font-size="26" fill="url(#lg-adm)">LW</text>
      </svg>
      <span class="brand-text">ADMIN</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">← На сайт</a>
      <button id="logoutBtn" class="btn-logout" hidden>Выйти</button>
    </nav>
  </header>

  <!-- Экран логина -->
  <section class="admin-login" id="loginScreen">
    <h1 class="page-title">ВХОД В АДМИНКУ</h1>
    <form id="loginForm" class="admin-form-narrow">
      <label><span>Пароль</span>
        <input type="password" id="loginPassword" required placeholder="••••••" />
      </label>
      <p class="form-error" id="loginError" hidden></p>
      <button type="submit" class="btn-submit">Войти</button>
      <p class="hint">По умолчанию: <code>admin123</code> — сразу смени в Настройках</p>
    </form>
  </section>

  <!-- Дашборд -->
  <section class="admin-dashboard" id="dashboard" hidden>
    <div class="admin-tabs">
      <button class="tab active" data-tab="items">📦 Товары</button>
      <button class="tab" data-tab="promos">🎉 Акции</button>
      <button class="tab" data-tab="orders">🧾 Заказы</button>
      <button class="tab" data-tab="banner">📢 Баннер</button>
      <button class="tab" data-tab="settings">⚙️ Настройки</button>
    </div>

    <!-- ТОВАРЫ -->
    <div class="tab-content active" id="tab-items">
      <h2 class="admin-title">Управление товарами</h2>
      <form id="itemForm" class="admin-form">
        <input type="hidden" id="itemEditId" />
        <div class="grid-2">
          <label><span>Название *</span><input type="text" id="itemName" required /></label>
          <label><span>Тип</span>
            <select id="itemType">
              <option value="privilege">Привилегия</option>
              <option value="case">Кейс</option>
              <option value="coins">Монеты</option>
              <option value="other">Другое</option>
            </select>
          </label>
          <label><span>Цена (₽) — оставь пусто, если нет</span><input type="number" id="itemPrice" min="0" step="1" /></label>
          <label><span>Метка вместо цены</span><input type="text" id="itemPriceLabel" placeholder="LITE / CREATIVE" /></label>
          <label><span>Цвет</span>
            <select id="itemColor">
              <option value="blue">Синий</option>
              <option value="green">Зелёный</option>
              <option value="gold">Золотой</option>
              <option value="yellow">Ярко-жёлтый</option>
              <option value="rainbow">Радужный</option>
              <option value="cyan">Голубой</option>
              <option value="purple">Фиолетовый</option>
            </select>
          </label>
        </div>
        <label><span>Описание (по одной строке)</span>
          <textarea id="itemList" rows="4" placeholder="Доступ к /kit&#10;+100 000 монет"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn-submit" id="itemSubmitBtn">Добавить товар</button>
          <button type="button" class="btn-copy" id="itemCancelBtn" hidden>Отмена</button>
        </div>
      </form>
      <div id="itemsTable" class="admin-table-wrap"></div>
    </div>

    <!-- АКЦИИ -->
    <div class="tab-content" id="tab-promos">
      <h2 class="admin-title">Акции и распродажи</h2>
      <form id="promoForm" class="admin-form">
        <div class="grid-2">
          <label><span>Название акции *</span><input type="text" id="promoName" required placeholder="Чёрная пятница" /></label>
          <label><span>Скидка % *</span><input type="number" id="promoDiscount" required min="1" max="99" value="20" /></label>
          <label><span>Действует до (необязательно)</span><input type="datetime-local" id="promoUntil" /></label>
          <label><span>Применять к</span>
            <select id="promoScope">
              <option value="all">Всем товарам</option>
              <option value="specific">Выбранным</option>
            </select>
          </label>
        </div>
        <div id="promoItemsBlock" hidden>
          <p class="hint">Отметь товары:</p>
          <div id="promoItemsList" class="promo-items-list"></div>
        </div>
        <button type="submit" class="btn-submit">Создать акцию</button>
      </form>
      <div id="promosTable" class="admin-table-wrap"></div>
    </div>

    <!-- ЗАКАЗЫ -->
    <div class="tab-content" id="tab-orders">
      <h2 class="admin-title">Заказы</h2>
      <div class="form-actions" style="margin-bottom:16px">
        <button class="btn-copy" id="exportOrdersBtn">💾 Экспорт JSON</button>
        <button class="btn-reset" id="clearOrdersBtn">🗑 Очистить все</button>
      </div>
      <div id="ordersTable" class="admin-table-wrap"></div>
    </div>

    <!-- БАННЕР -->
    <div class="tab-content" id="tab-banner">
      <h2 class="admin-title">Баннер на каталоге</h2>
      <form id="bannerForm" class="admin-form">
        <label><span>Текст баннера</span>
          <textarea id="bannerText" rows="2" placeholder="🔥 Скидка 20% на всё до конца недели!"></textarea>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="bannerActive" /> Показывать баннер
        </label>
        <button type="submit" class="btn-submit">Сохранить</button>
      </form>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="tab-content" id="tab-settings">
      <h2 class="admin-title">Настройки</h2>
      <form id="passwordForm" class="admin-form">
        <label><span>Новый пароль админки (мин. 6)</span><input type="password" id="newPassword" minlength="6" required /></label>
        <button type="submit" class="btn-submit">Сменить пароль</button>
        <p class="hint" id="passwordMsg" hidden></p>
      </form>
      <hr style="margin:24px 0;border-color:rgba(255,255,255,0.1)">
      <div class="admin-form">
        <p><strong>Резервная копия данных</strong></p>
        <div class="form-actions">
          <button class="btn-copy" id="exportAllBtn">💾 Экспорт всех данных</button>
          <label class="btn-copy" style="cursor:pointer">
            📂 Импорт
            <input type="file" id="importFile" accept=".json" hidden />
          </label>
        </div>
        <p class="hint" style="margin-top:16px"><strong>Опасная зона</strong></p>
        <button class="btn-reset" id="resetAllBtn">💥 Сброс к заводским настройкам</button>
      </div>
    </div>
  </section>

  <script src="admin.js"></script>
</body>
</html>
